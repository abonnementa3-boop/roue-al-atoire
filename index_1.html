<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tourne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141B34;
  --ink-2:#1E2748;
  --ink-3:#2A3558;
  --paper:#F2F0EA;
  --muted:#96A0C6;
  --gold:#F5C451;
  --line:rgba(242,240,234,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:400;font-size:16px;line-height:1.5;
  min-height:100vh;padding:20px 16px 48px;
  display:flex;flex-direction:column;align-items:center;
}
.app{width:100%;max-width:440px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
.sub{font-size:13px;color:var(--muted);margin:0 0 18px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:rgba(242,240,234,.3);color:var(--paper)}
.tab.on{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:600}
.tab.add{width:38px;padding:7px 0;text-align:center;font-size:18px;line-height:1}

.stage{position:relative;width:100%;aspect-ratio:1;max-width:360px;margin:0 auto}
.needle{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--gold)}
.rotor{position:absolute;inset:14px 0 0;transform-origin:50% 50%}
.rotor svg{display:block;width:100%;height:auto}
.hub{position:absolute;left:50%;top:calc(50% + 7px);transform:translate(-50%,-50%);z-index:4;
  width:76px;height:76px;border-radius:50%;background:var(--ink);border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hub span{width:8px;height:8px;border-radius:50%;background:var(--gold)}

.go{display:block;width:100%;margin:22px 0 0;height:56px;border:0;border-radius:14px;
  background:var(--gold);color:#2A2103;font:inherit;font-size:18px;font-weight:800;letter-spacing:-.01em;cursor:pointer}
.go:active{transform:scale(.99)}
.go:disabled{opacity:.45;cursor:default}
.result{text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em;margin:18px 0 0;min-height:42px}
.result.empty{font-size:14px;font-weight:400;color:var(--muted)}

.bar{display:flex;gap:10px;margin-top:22px}
.ghost{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:14px;padding:10px;border-radius:10px;cursor:pointer}
.ghost:hover{color:var(--paper);border-color:rgba(242,240,234,.3)}

.drawer{display:none;margin-top:14px;background:var(--ink-2);border-radius:14px;padding:16px}
.drawer.open{display:block}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input,textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);
  font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.field+.field{margin-top:14px}
.danger{background:transparent;border:1px solid rgba(230,120,110,.4);color:#E8837A;
  font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer;margin-top:14px}

.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.row .nm{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input{width:68px;text-align:center;padding:7px 4px;font-size:14px}
.row .pc{width:58px;text-align:right;font-size:14px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.45}
@media (prefers-reduced-motion:reduce){.rotor{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <h1>Tourne</h1>
  <p class="sub">Plusieurs roues, un seul écran.</p>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="needle"></div>
    <div class="rotor" id="rotor"><svg id="wheel" viewBox="0 0 200 200"></svg></div>
    <div class="hub" id="hub" title=""><span></span></div>
  </div>

  <button class="go" id="go">Tourner</button>
  <p class="result empty" id="result">Appuyez pour lancer</p>

  <div class="bar">
    <button class="ghost" id="editBtn">Modifier la roue</button>
  </div>

  <div class="drawer" id="edit">
    <div class="field">
      <label for="wname">Nom de la roue</label>
      <input id="wname" type="text" maxlength="28" placeholder="Qui fait la vaisselle">
    </div>
    <div class="field">
      <label for="ents">Participants, un par ligne</label>
      <textarea id="ents" rows="6" placeholder="Lucas&#10;Sarah&#10;Mehdi"></textarea>
    </div>
    <button class="danger" id="del">Supprimer cette roue</button>
  </div>

  <div class="drawer" id="odds">
    <div class="row" style="margin-bottom:12px">
      <span class="nm" style="color:var(--muted);font-size:13px">Poids</span>
      <button class="ghost" id="even" style="flex:0 0 auto;padding:7px 12px">Égaliser</button>
    </div>
    <div id="rows"></div>
    <p class="hint">À droite, la chance réelle de chaque nom. Les parts de la roue restent de taille égale à l'écran.</p>
  </div>
</div>

<script>
(function(){
"use strict";
var PAL=["#E0736B","#5FB7A0","#7C86D6","#E8A24C","#C97BB0","#6FA9DF","#8FBF66","#D9615F"];
var KEY="tourne.v1";
var S={wheels:[],cur:0};
var rot=0,busy=false,taps=[];

var $=function(id){return document.getElementById(id)};
var tabs=$("tabs"),svg=$("wheel"),rotor=$("rotor"),res=$("result"),go=$("go");
var edit=$("edit"),odds=$("odds"),rows=$("rows"),wname=$("wname"),ents=$("ents");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var d=JSON.parse(raw);if(d&&d.wheels&&d.wheels.length){S=d;S.cur=Math.min(S.cur||0,S.wheels.length-1);return}}
  }catch(e){}
  S={cur:0,wheels:[{name:"Qui fait la vaisselle",items:[
    {n:"Lucas",w:1},{n:"Sarah",w:1},{n:"Mehdi",w:1},{n:"Chloé",w:1},{n:"Tom",w:1},{n:"Inès",w:1}]}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cur(){return S.wheels[S.cur]}

function renderTabs(){
  var h="";
  for(var i=0;i<S.wheels.length;i++)
    h+='<button class="tab'+(i===S.cur?" on":"")+'" data-i="'+i+'">'+esc(S.wheels[i].name||"Sans nom")+'</button>';
  h+='<button class="tab add" id="addW" aria-label="Nouvelle roue">+</button>';
  tabs.innerHTML=h;
  var bs=tabs.querySelectorAll(".tab[data-i]");
  for(var j=0;j<bs.length;j++)bs[j].onclick=function(e){
    S.cur=+e.currentTarget.getAttribute("data-i");rot=0;rotor.style.transition="none";rotor.style.transform="none";
    save();renderAll();
  };
  $("addW").onclick=function(){
    S.wheels.push({name:"Nouvelle roue",items:[{n:"Option 1",w:1},{n:"Option 2",w:1}]});
    S.cur=S.wheels.length-1;rot=0;rotor.style.transition="none";rotor.style.transform="none";
    save();renderAll();edit.classList.add("open");wname.focus();wname.select();
  };
}

function arc(i,n){
  var seg=360/n,a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180,r=96;
  var x0=100+r*Math.cos(a0),y0=100+r*Math.sin(a0),x1=100+r*Math.cos(a1),y1=100+r*Math.sin(a1);
  return "M100,100 L"+x0.toFixed(2)+","+y0.toFixed(2)+" A"+r+","+r+" 0 "+(seg>180?1:0)+",1 "+x1.toFixed(2)+","+y1.toFixed(2)+" Z";
}
function renderWheel(){
  var it=cur().items,h="",n=it.length;
  if(!n){svg.innerHTML='<circle cx="100" cy="100" r="96" fill="#1E2748"/>';return}
  if(n===1){
    h='<circle cx="100" cy="100" r="96" fill="'+PAL[0]+'"/>'
     +'<text x="100" y="36" fill="#141B34" font-size="10" font-weight="600" text-anchor="middle">'+esc(it[0].n)+'</text>';
    svg.innerHTML=h;return;
  }
  for(var i=0;i<n;i++){
    var seg=360/n,mid=(i+0.5)*seg-90;
    h+='<path d="'+arc(i,n)+'" fill="'+PAL[i%PAL.length]+'" stroke="#141B34" stroke-width="1"/>';
    var tx=100+62*Math.cos(mid*Math.PI/180),ty=100+62*Math.sin(mid*Math.PI/180);
    var lbl=it[i].n.length>12?it[i].n.slice(0,11)+"…":it[i].n;
    var fs=n>14?7:(n>9?8:9.5);
    h+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" fill="#141B34" font-size="'+fs+'" font-weight="600"'
      +' text-anchor="middle" dominant-baseline="middle" transform="rotate('+mid.toFixed(1)+' '+tx.toFixed(1)+' '+ty.toFixed(1)+')">'
      +esc(lbl)+'</text>';
  }
  svg.innerHTML=h;
}

function renderOdds(){
  var it=cur().items,tot=0,i;
  for(i=0;i<it.length;i++)tot+=(it[i].w>0?it[i].w:0);
  var h="";
  for(i=0;i<it.length;i++){
    var p=tot>0?((it[i].w>0?it[i].w:0)/tot*100):0;
    h+='<div class="row"><span class="nm">'+esc(it[i].n)+'</span>'
      +'<input type="number" min="0" step="1" value="'+it[i].w+'" data-i="'+i+'" aria-label="Poids de '+esc(it[i].n)+'">'
      +'<span class="pc">'+p.toFixed(1)+'%</span></div>';
  }
  rows.innerHTML=h;
  var ins=rows.querySelectorAll("input");
  for(i=0;i<ins.length;i++)ins[i].oninput=function(e){
    var v=parseFloat(e.target.value);
    cur().items[+e.target.getAttribute("data-i")].w=(isNaN(v)||v<0)?0:v;
    save();renderOdds();
  };
}

function renderEdit(){
  wname.value=cur().name;
  ents.value=cur().items.map(function(x){return x.n}).join("\n");
}
function renderAll(){renderTabs();renderWheel();renderEdit();renderOdds();
  res.className="result empty";res.textContent="Appuyez pour lancer";}

function pick(it){
  var tot=0,i;
  for(i=0;i<it.length;i++)tot+=(it[i].w>0?it[i].w:0);
  if(tot<=0)return Math.floor(Math.random()*it.length);
  var r=Math.random()*tot,acc=0;
  for(i=0;i<it.length;i++){acc+=(it[i].w>0?it[i].w:0);if(r<acc)return i}
  return it.length-1;
}

go.onclick=function(){
  var it=cur().items;
  if(it.length<2){res.className="result empty";res.textContent="Ajoutez au moins deux participants";return}
  if(busy)return;
  busy=true;go.disabled=true;res.className="result empty";res.textContent="…";
  var idx=pick(it),seg=360/it.length,mid=(idx+0.5)*seg;
  var jit=(Math.random()-0.5)*(seg-Math.min(8,seg*0.3));
  var turns=5+Math.floor(Math.random()*3);
  var target=rot+turns*360+((360-((rot+mid+jit)%360))%360);
  var dur=4.3+Math.random()*1.2;
  rotor.style.transition="transform "+dur.toFixed(2)+"s cubic-bezier(.16,.84,.3,1)";
  rotor.style.transform="rotate("+target.toFixed(2)+"deg)";
  rot=target;
  setTimeout(function(){
    res.className="result";res.textContent=it[idx].n;
    busy=false;go.disabled=false;
  },dur*1000+90);
};

$("editBtn").onclick=function(){edit.classList.toggle("open")};

wname.oninput=function(){cur().name=wname.value.trim()||"Sans nom";save();renderTabs()};

ents.oninput=function(){
  var old={},i;
  for(i=0;i<cur().items.length;i++)old[cur().items[i].n]=cur().items[i].w;
  var ns=ents.value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  cur().items=ns.map(function(n){return {n:n,w:old.hasOwnProperty(n)?old[n]:1}});
  rot=0;rotor.style.transition="none";rotor.style.transform="none";
  save();renderWheel();renderOdds();
};

$("del").onclick=function(){
  if(S.wheels.length<2){alert("Il faut garder au moins une roue.");return}
  if(!confirm("Supprimer « "+cur().name+" » ?"))return;
  S.wheels.splice(S.cur,1);S.cur=0;rot=0;
  rotor.style.transition="none";rotor.style.transform="none";
  save();renderAll();edit.classList.remove("open");odds.classList.remove("open");
};

$("even").onclick=function(){
  for(var i=0;i<cur().items.length;i++)cur().items[i].w=1;
  save();renderOdds();
};

$("hub").onclick=function(){
  var t=Date.now();taps.push(t);taps=taps.filter(function(x){return t-x<1200});
  if(taps.length>=3){taps=[];odds.classList.toggle("open");if(odds.classList.contains("open"))renderOdds()}
};

load();renderAll();
})();
</script>
</body>
</html>
